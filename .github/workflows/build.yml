name: Build APK from Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (contoh: v1.0.0)'
        required: true
        type: string
      build_type:
        description: 'Jenis Build'
        required: true
        type: choice
        options:
          - debug
          - release
        default: release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download source ZIP from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p source
          cd source
          
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --clobber

          unzip -o *.zip || true

          PUBSPEC=$(find . -not -path "*/build/*" -not -path "*/.git/*" -name "pubspec.yaml" | head -1)
          
          if [ -z "$PUBSPEC" ]; then
            echo "❌ ERROR: pubspec.yaml TIDAK DITEMUKAN!"
            exit 1
          fi

          ROOT=$(dirname "$PUBSPEC")
          ABS_ROOT="$(pwd)/$ROOT"
          echo "PROJECT_ROOT=$ABS_ROOT" >> $GITHUB_ENV

      # ✅ PERBAIKI GRADLE VERSI & DSL
      - name: Fix Gradle & AGP Compatibility
        run: |
          cd "${{ env.PROJECT_ROOT }}/android"
          
          # Upgrade Gradle ke 8.14.0
          sed -i 's/gradle-8\.[0-9]*\.[0-9]*/gradle-8.14.0/g' gradle/wrapper/gradle-wrapper.properties
          
          # Disable new DSL untuk kompatibilitas Flutter
          echo "android.newDsl=false" >> gradle.properties
          
          echo "✅ Gradle & DSL fixed!"

      - name: Flutter pub get
        run: |
          cd "${{ env.PROJECT_ROOT }}"
          flutter pub get

      # ✅ Pakai flag untuk melewati validasi
      - name: Build APK
        run: |
          cd "${{ env.PROJECT_ROOT }}"
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug --android-skip-build-dependency-validation
          else
            flutter build apk --release --android-skip-build-dependency-validation
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}.apk
          path: |
            ${{ env.PROJECT_ROOT }}/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
