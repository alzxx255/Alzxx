
name: Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing source ZIP"
        required: true
        type: string
      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.repository }}-${{ inputs.tag }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter ${{ inputs.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      SOURCE_DIR: ${{ github.workspace }}/source
      LOG_DIR: ${{ github.workspace }}/build_logs
      RAW_LOG: /tmp/flutter-build-full.log

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip gh
          mkdir -p "$SOURCE_DIR" "$LOG_DIR"
          : > "$RAW_LOG"
          rm -f "$LOG_DIR/build-error.txt"

      - name: Download source ZIP
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern "*.zip" \
            --clobber

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP source tidak ditemukan."
            exit 1
          fi

          unzip -o "$ZIP_FILE"
          rm -f "$ZIP_FILE"

      - name: Detect Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PUBSPEC_LIST < <(
            find "$SOURCE_DIR" -type f -name "pubspec.yaml" \
              -not -path "*/build/*" \
              -not -path "*/.git/*" \
              -not -path "*/.pub/*"
          )

          PUBSPEC="${PUBSPEC_LIST[0]:-}"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            find "$SOURCE_DIR" -maxdepth 3 -type f \
              -name "pubspec.yaml" -print
            exit 1
          fi

          PROJECT_ROOT="$(cd "$(dirname "$PUBSPEC")" && pwd)"

          if [ ! -d "$PROJECT_ROOT/android" ]; then
            echo "ERROR: Folder android tidak ditemukan."
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.32.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Flutter environment check
        shell: bash
        run: |
          set -euo pipefail
          flutter --version
          dart --version

      - name: Flutter clean
        id: clean
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set +e
          cd "$PROJECT_ROOT"
          flutter clean > "$RAW_LOG" 2>&1
          RESULT=$?
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "Flutter clean gagal."
            tail -n 20 "$RAW_LOG"
            exit "$RESULT"
          fi

      - name: Flutter pub get
        id: pubget
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set +e
          cd "$PROJECT_ROOT"
          flutter pub get > "$RAW_LOG" 2>&1
          RESULT=$?
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "Dependency installation gagal."
            tail -n 30 "$RAW_LOG"
            exit "$RESULT"
          fi

      - name: Fix Gradle Compatibility
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/android"
          touch gradle.properties

          grep -qxF 'android.newDsl=false' gradle.properties ||
            echo 'android.newDsl=false' >> gradle.properties

          grep -q '^org.gradle.jvmargs=' gradle.properties ||
            echo 'org.gradle.jvmargs=-Xmx4G' >> gradle.properties

      - name: Build APK
        id: apk_build
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set +e
          cd "$PROJECT_ROOT"

          flutter build apk --"$BUILD_TYPE" --verbose \
            > "$RAW_LOG" 2>&1

          RESULT=$?
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "Build APK gagal."
            tail -n 35 "$RAW_LOG"
            exit "$RESULT"
          fi

      - name: Package APK
        if: success()
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_ROOT/build/app/outputs/flutter-apk"
          OUTPUT_DIR="$GITHUB_WORKSPACE/apk_output"

          mkdir -p "$OUTPUT_DIR"

          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" \
            -exec cp {} "$OUTPUT_DIR/" \;

          if ! find "$OUTPUT_DIR" -maxdepth 1 \
            -type f -name "*.apk" | grep -q .; then
            echo "ERROR: APK tidak ditemukan setelah build."
            exit 1
          fi

          ls -lh "$OUTPUT_DIR"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: ${{ github.workspace }}/apk_output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Generate concise build report
        if: always()
        shell: bash
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          PUBGET_OUTCOME: ${{ steps.pubget.outcome }}
          BUILD_OUTCOME: ${{ steps.apk_build.outcome }}
        run: |
          mkdir -p "$LOG_DIR"

          python3 - "$RAW_LOG" "$LOG_DIR/build-error.txt" <<'PY'
          import os
          import re
          import sys

          raw_path, report_path = sys.argv[1:3]

          try:
              with open(raw_path, encoding="utf-8",
                        errors="replace") as f:
                  lines = f.read().splitlines()
          except OSError:
              lines = []

          mode = os.getenv("BUILD_TYPE", "unknown")
          download = os.getenv("DOWNLOAD_OUTCOME", "unknown")
          project = os.getenv("PROJECT_OUTCOME", "unknown")
          clean = os.getenv("CLEAN_OUTCOME", "unknown")
          pubget = os.getenv("PUBGET_OUTCOME", "unknown")
          build = os.getenv("BUILD_OUTCOME", "unknown")

          patterns = [
              r"FAILURE: Build failed",
              r"What went wrong:",
              r"Execution failed for task",
              r"Manifest merger failed",
              r"Could not resolve",
              r"Could not find",
              r"Target of URI doesn't exist",
              r"Compilation failed",
              r"Error:",
              r"error:",
              r"\be: ",
              r"Caused by:",
              r"Exception:",
              r"Unresolved reference",
              r"requires a higher",
              r"Minimum supported Gradle",
              r"Unsupported class file",
              r"Duplicate class",
              r"already defined",
              r"Expected .+ but found",
              r"SocketException",
              r"HandshakeException",
              r"Connection timed out",
              r"OutOfMemoryError",
              r"Permission denied",
              r"not found",
          ]

          matcher = re.compile("|".join(patterns), re.I)
          noise = re.compile(
              r"Current runner version|"
              r"Post job cleanup|"
              r"Shutdown hooks complete|"
              r"^\s*#\d+\s|"
              r"^\s*at\s+.*\([^)]*:\d+:\d+\)\s*$",
              re.I,
          )

          selected = []
          seen = set()

          for i, line in enumerate(lines):
              if matcher.search(line):
                  for item in lines[max(0, i-1):min(len(lines), i+3)]:
                      item = item.strip()
                      if item and not noise.search(item) and item not in seen:
                          seen.add(item)
                          selected.append(item)

          outcomes = [
              ("Download source", download),
              ("Detect project", project),
              ("Flutter clean", clean),
              ("Flutter pub get", pubget),
              ("Build APK", build),
          ]

          failed = [(name, status) for name, status in outcomes
                    if status == "failure"]

          if not failed and build == "success":
              content = (
                  "BUILD SUCCESS\n"
                  f"Mode: {mode}\n"
                  "APK build selesai.\n"
              )
          else:
              content = (
                  "BUILD FAILED\n"
                  f"Mode: {mode}\n"
                  "===== STEP =====\n"
              )

              if failed:
                  content += "\n".join(
                      f"{name}: {status}" for name, status in failed
                  ) + "\n"

              content += "\n===== ERROR UTAMA =====\n"

              if selected:
                  content += "\n".join(selected[:35]) + "\n"
              elif download == "failure":
                  content += (
                      "Gagal mengunduh source ZIP dari GitHub Release.\n"
                      "Periksa tag, ZIP, dan akses repository.\n"
                  )
              elif project == "failure":
                  content += (
                      "Proyek Flutter tidak terdeteksi.\n"
                      "Pastikan ZIP berisi pubspec.yaml dan android/.\n"
                  )
              elif pubget == "failure":
                  content += (
                      "flutter pub get gagal. Periksa dependency "
                      "dan pubspec.yaml.\n"
                  )
              elif clean == "failure":
                  content += "flutter clean gagal.\n"
              else:
                  useful = [
                      line.strip() for line in lines
                      if line.strip() and not noise.search(line)
                  ]
                  content += "\n".join(useful[-15:]) + "\n"

          marker = b"\n[LOG DIPANGKAS: batas 4 KB]\n"
          data = content.encode("utf-8")

          if len(data) > 4096:
              data = (
                  data[:4096-len(marker)]
                  .decode("utf-8", errors="ignore")
                  .encode("utf-8") + marker
              )

          with open(report_path, "wb") as f:
              f.write(data)

          print("===== ALDOO_BUILD_REPORT_BEGIN =====")
          print(data.decode("utf-8", errors="replace"), end="")
          print()
          print("===== ALDOO_BUILD_REPORT_END =====")
          print(f"Report size: {len(data)} bytes")
          PY

      - name: Upload build error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.build_type }}
          path: ${{ github.workspace }}/build_logs/build-error.txt
          if-no-files-found: error
          retention-days: 7
