- name: Download source ZIP from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p source
          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --dir source

          cd source
          unzip -o *.zip

          echo "=== Isi setelah unzip ==="
          find . -maxdepth 3 -type f -name "pubspec.yaml" || true
          ls -la

          # Cari pubspec.yaml di mana pun
          PUBSPEC=$(find . -name "pubspec.yaml" | head -1)
          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan!"
            exit 1
          fi

          ROOT=$(dirname "$PUBSPEC")
          echo "PROJECT_ROOT=$ROOT" >> $GITHUB_ENV
          echo "Ketemu project di: $ROOT"

      - name: Flutter pub get
        run: |
          cd "${{ env.PROJECT_ROOT }}"
          echo "Sekarang di: $(pwd)"
          ls -la
          flutter pub get

      - name: Build APK
        run: |
          cd "${{ env.PROJECT_ROOT }}"
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi
