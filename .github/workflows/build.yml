name: Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing source ZIP"
        required: true
        type: string
      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.repository }}-${{ inputs.tag }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter ${{ inputs.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      SOURCE_DIR: ${{ github.workspace }}/source
      LOG_DIR: ${{ github.workspace }}/build_logs
      RAW_LOG: /tmp/flutter-build-full.log

    steps:
      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip gh
          mkdir -p "$SOURCE_DIR" "$LOG_DIR"
          : > "$RAW_LOG"
          find "$LOG_DIR" -mindepth 1 -delete || true

      - name: Download source ZIP
        id: download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd "$SOURCE_DIR"

          {
            echo ""
            echo "===== DOWNLOAD SOURCE (tag=$RELEASE_TAG) ====="
          } >> "$RAW_LOG"

          gh release download "$RELEASE_TAG" \
            --repo "$REPOSITORY" \
            --pattern "*.zip" \
            --clobber >> "$RAW_LOG" 2>&1

          ZIP_FILE="$(find . -maxdepth 1 -type f \
            -iname '*.zip' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Tidak ada file *.zip pada release '$RELEASE_TAG'." | tee -a "$RAW_LOG"
            exit 1
          fi

          echo "Extracting: $ZIP_FILE" | tee -a "$RAW_LOG"
          unzip -o "$ZIP_FILE" >> "$RAW_LOG" 2>&1
          rm -f "$ZIP_FILE"

      - name: Detect Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t PUBSPEC_LIST < <(
            find "$SOURCE_DIR" -type f -name "pubspec.yaml" \
              -not -path "*/build/*" \
              -not -path "*/.git/*" \
              -not -path "*/.pub/*"
          )

          PUBSPEC="${PUBSPEC_LIST[0]:-}"

          if [ -z "$PUBSPEC" ]; then
            {
              echo ""
              echo "===== PROJECT DETECTION FAILED ====="
              echo "pubspec.yaml tidak ditemukan di source ZIP."
              echo "Isi direktori $SOURCE_DIR (max depth 3):"
              find "$SOURCE_DIR" -maxdepth 3 -print | head -n 100
            } | tee -a "$RAW_LOG"
            exit 1
          fi

          PROJECT_ROOT="$(cd "$(dirname "$PUBSPEC")" && pwd)"

          if [ ! -d "$PROJECT_ROOT/android" ]; then
            {
              echo ""
              echo "===== PROJECT DETECTION FAILED ====="
              echo "Folder android/ tidak ditemukan di $PROJECT_ROOT"
              ls -la "$PROJECT_ROOT"
            } | tee -a "$RAW_LOG"
            exit 1
          fi

          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "PROJECT_ROOT=$PROJECT_ROOT" | tee -a "$RAW_LOG"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter 3.32.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.32.8"
          channel: stable
          cache: true

      - name: Flutter environment check
        shell: bash
        run: |
          set -euo pipefail
          {
            echo ""
            echo "===== FLUTTER ENV ====="
          } >> "$RAW_LOG"
          flutter --version 2>&1 | tee -a "$RAW_LOG"
          dart --version 2>&1 | tee -a "$RAW_LOG"

      - name: Flutter clean
        id: clean
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set +e
          cd "$PROJECT_ROOT"
          {
            echo ""
            echo "===== flutter clean ====="
          } >> "$RAW_LOG"
          flutter clean >> "$RAW_LOG" 2>&1
          RESULT=$?
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::flutter clean gagal (exit=$RESULT)"
            echo "===== flutter clean ERROR (tail) ====="
            tail -n 120 "$RAW_LOG"
            exit "$RESULT"
          fi

      - name: Flutter pub get
        id: pubget
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set +e
          cd "$PROJECT_ROOT"
          {
            echo ""
            echo "===== flutter pub get ====="
          } >> "$RAW_LOG"
          flutter pub get >> "$RAW_LOG" 2>&1
          RESULT=$?
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::flutter pub get gagal (exit=$RESULT)"
            echo "===== flutter pub get ERROR (tail) ====="
            tail -n 120 "$RAW_LOG"
            exit "$RESULT"
          fi

      - name: Fix Gradle Compatibility
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -euo pipefail
          cd "$PROJECT_ROOT/android"
          touch gradle.properties

          grep -qxF 'android.newDsl=false' gradle.properties ||
            echo 'android.newDsl=false' >> gradle.properties

          grep -q '^org.gradle.jvmargs=' gradle.properties ||
            echo 'org.gradle.jvmargs=-Xmx4G' >> gradle.properties

      - name: Build APK
        id: apk_build
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set +e
          cd "$PROJECT_ROOT"

          {
            echo ""
            echo "===== flutter build apk --${BUILD_TYPE} ====="
          } >> "$RAW_LOG"

          flutter build apk --"$BUILD_TYPE" --verbose >> "$RAW_LOG" 2>&1
          RESULT=$?
          set -e

          if [ "$RESULT" -ne 0 ]; then
            echo "::error::flutter build apk gagal (exit=$RESULT)"
            echo "===== flutter build apk ERROR (tail) ====="
            tail -n 150 "$RAW_LOG"
            exit "$RESULT"
          fi

      - name: Package APK
        if: success()
        shell: bash
        env:
          PROJECT_ROOT: ${{ steps.project.outputs.project_root }}
        run: |
          set -euo pipefail

          APK_DIR="$PROJECT_ROOT/build/app/outputs/flutter-apk"
          OUTPUT_DIR="$GITHUB_WORKSPACE/apk_output"

          mkdir -p "$OUTPUT_DIR"

          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" \
            -exec cp {} "$OUTPUT_DIR/" \;

          if ! find "$OUTPUT_DIR" -maxdepth 1 \
            -type f -name "*.apk" | grep -q .; then
            echo "::error::APK tidak ditemukan setelah build sukses."
            exit 1
          fi

          ls -lh "$OUTPUT_DIR"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: ${{ github.workspace }}/apk_output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Persist raw log
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"
          if [ -f "$RAW_LOG" ]; then
            cp "$RAW_LOG" "$LOG_DIR/raw-build.log"
          fi

      - name: Generate build report
        if: always()
        shell: bash
        env:
          DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
          CLEAN_OUTCOME: ${{ steps.clean.outcome }}
          PUBGET_OUTCOME: ${{ steps.pubget.outcome }}
          BUILD_OUTCOME: ${{ steps.apk_build.outcome }}
        run: |
          mkdir -p "$LOG_DIR"

          python3 - "$RAW_LOG" "$LOG_DIR/build-error.txt" <<'PY'
          import os
          import re
          import sys

          raw_path, report_path = sys.argv[1:3]

          try:
              with open(raw_path, encoding="utf-8", errors="replace") as f:
                  raw = f.read()
          except OSError:
              raw = ""

          lines = raw.splitlines()

          mode = os.getenv("BUILD_TYPE", "unknown")
          steps = [
              ("Download source", os.getenv("DOWNLOAD_OUTCOME", "unknown")),
              ("Detect project",  os.getenv("PROJECT_OUTCOME",  "unknown")),
              ("Flutter clean",   os.getenv("CLEAN_OUTCOME",    "unknown")),
              ("Flutter pub get", os.getenv("PUBGET_OUTCOME",   "unknown")),
              ("Build APK",       os.getenv("BUILD_OUTCOME",    "unknown")),
          ]
          failed_steps = [n for n, s in steps if s == "failure"]

          # Pure noise: framework stack frames and CI chatter
          noise_re = re.compile(
              r"^Post job cleanup|"
              r"^Shutdown hooks complete|"
              r"^Current runner version|"
              r"^\s*at\s+[\w.$<>/]+\([^)]*\)\s*$|"
              r"^Note:\s",
              re.I,
          )

          def ok(l):
              return bool(l.strip()) and not noise_re.search(l)

          def block(start, end, limit=400):
              out = []
              for j in range(start, min(end, start + limit)):
                  if ok(lines[j]):
                      out.append(lines[j].rstrip())
              return out

          def dedupe(seq):
              seen = set()
              out = []
              for x in seq:
                  if x not in seen:
                      seen.add(x)
                      out.append(x)
              return out

          sections = []

          # 1) Gradle "What went wrong:" block — the money shot
          wgw_idx = None
          for i, l in enumerate(lines):
              if "What went wrong:" in l:
                  wgw_idx = i
                  break
          if wgw_idx is not None:
              end = len(lines)
              for k in range(wgw_idx, min(len(lines), wgw_idx + 800)):
                  if re.match(r"^BUILD (FAILED|SUCCESSFUL)", lines[k]):
                      end = k + 1
                      break
              blk = block(wgw_idx, end)
              if blk:
                  sections.append(("GRADLE - What went wrong", blk))

          # 2) Dart / Flutter compiler + analyzer errors
          dart_errs = []
          for i, l in enumerate(lines):
              if re.match(r"^\s*(e|error|Error):\s", l) or \
                 re.search(r"\berror:\s", l, re.I):
                  for j in range(max(0, i - 1), min(len(lines), i + 3)):
                      if ok(lines[j]):
                          dart_errs.append(lines[j].rstrip())
          if dart_errs:
              sections.append(
                  ("COMPILER / ANALYZER ERRORS", dedupe(dart_errs)[:150])
              )

          # 3) Gradle FAILURE without the "What went wrong" block
          if not any("What went wrong" in t for t, _ in sections):
              for i, l in enumerate(lines):
                  if "FAILURE: Build failed" in l:
                      blk = block(i, len(lines), limit=250)
                      if blk:
                          sections.append(("GRADLE - Build failed", blk))
                      break

          # 4) Fallback — anything error-ish with context
          if not sections:
              pat = re.compile(
                  r"(error|exception|failed|cannot|not found|"
                  r"denied|unresolved|missing|invalid|"
                  r"version|incompatible)",
                  re.I,
              )
              hits = []
              for i, l in enumerate(lines):
                  if pat.search(l):
                      for j in range(max(0, i - 1),
                                     min(len(lines), i + 4)):
                          if ok(lines[j]):
                              hits.append(lines[j].rstrip())
              if hits:
                  sections.append(("ERROR LINES", dedupe(hits)[:200]))

          # 5) Absolute last resort — tail of the raw log
          if not sections:
              tail = [l.rstrip() for l in lines[-200:] if ok(l)]
              if tail:
                  sections.append(("RAW LOG TAIL", tail))

          # Compose report
          out = []
          if not failed_steps and os.getenv("BUILD_OUTCOME") == "success":
              out.append("BUILD SUCCESS")
              out.append(f"Mode: {mode}")
              out.append("APK build selesai tanpa error.")
          else:
              out.append("BUILD FAILED")
              out.append(f"Mode: {mode}")
              out.append("")
              out.append("===== STEP YANG GAGAL =====")
              if failed_steps:
                  for n in failed_steps:
                      out.append(f"- {n}")
              else:
                  out.append("- (tidak ada, lihat raw-build.log)")
              out.append("")
              for title, blk in sections:
                  out.append(f"===== {title} =====")
                  out.extend(blk)
                  out.append("")

          content = "\n".join(out).rstrip() + "\n"
          data = content.encode("utf-8")

          with open(report_path, "wb") as f:
              f.write(data)

          print("===== BUILD REPORT BEGIN =====")
          print(content, end="")
          print("===== BUILD REPORT END =====")
          print(f"Report size: {len(data)} bytes")
          PY

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ inputs.build_type }}
          path: |
            ${{ github.workspace }}/build_logs/build-error.txt
            ${{ github.workspace }}/build_logs/raw-build.log
          if-no-files-found: warn
          retention-days: 7
