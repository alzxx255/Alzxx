
          if [ "$RESULT" -ne 0 ]; then
            exit "$RESULT"
          fi

      - name: Generate concise build report
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.apk_build.outcome }}
          PUBGET_OUTCOME: ${{ steps.pubget.outcome }}
          PROJECT_OUTCOME: ${{ steps.project.outcome }}
        run: |
          mkdir -p "$LOG_DIR"

          python3 - "$RAW_LOG" "$LOG_DIR/build-error.txt" <<'PY'
          import os
          import re
          import sys

          raw_path, report_path = sys.argv[1:3]
          build_outcome = os.environ.get("BUILD_OUTCOME", "unknown")
          pubget_outcome = os.environ.get("PUBGET_OUTCOME", "unknown")
          project_outcome = os.environ.get("PROJECT_OUTCOME", "unknown")
          mode = os.environ.get("BUILD_TYPE", "unknown")

          try:
              with open(raw_path, encoding="utf-8",
                        errors="replace") as f:
                  lines = f.read().splitlines()
          except OSError:
              lines = []

          patterns = [
              r"FAILURE: Build failed",
              r"What went wrong:",
              r"Execution failed for task",
              r"Manifest merger failed",
              r"Could not resolve",
              r"Could not find",
              r"Target of URI doesn't exist",
              r"Because .+ depends on",
              r"Compilation failed",
              r"Error:",
              r"error:",
              r"e: ",
              r"Caused by:",
              r"Exception:",
              r"Unresolved reference",
              r"requires a higher",
              r"Unsupported class file",
              r"Minimum supported Gradle",
              r"Duplicate class",
              r"already defined",
              r"Expected .+ but found",
              r"Invalid depfile",
              r"SocketException",
              r"HandshakeException",
              r"Connection timed out",
              r"Out of memory",
              r"Process completed with exit code",
          ]

          matcher = re.compile("|".join(patterns), re.I)

          noise = re.compile(
              r"Current runner version|"
              r"Post job cleanup|"
              r"Shutdown hooks complete|"
              r"^\s*#\d+\s|"
              r"^\s*at\s+.*\([^)]*:\d+:\d+\)\s*$|"
              r"^\s*\[.*\]\s*$",
              re.I,
          )

          selected = []
          seen = set()

          for i, line in enumerate(lines):
              if not matcher.search(line):
                  continue

              start = max(0, i - 1)
              end = min(len(lines), i + 3)

              for item in lines[start:end]:
                  item = item.strip()

                  if not item or noise.search(item):
                      continue

                  if item in seen:
                      continue

                  seen.add(item)
                  selected.append(item)

          if build_outcome == "success":
              content = (
                  "BUILD SUCCESS\n"
                  f"Mode: {mode}\n"
                  "APK build step selesai tanpa error.\n"
              )
          else:
              content = (
                  "BUILD FAILED\n"
                  "Step: Build APK\n"
                  f"Mode: {mode}\n"
                  f"Project detection: {project_outcome}\n"
                  f"Dependency step: {pubget_outcome}\n"
                  f"Build step: {build_outcome}\n\n"
                  "===== ERROR UTAMA =====\n"
              )

              if selected:
                  content += "\n".join(selected[:35]) + "\n"
              elif pubget_outcome == "failure":
                  content += (
                      "Dependency gagal dipasang.\n"
                      "Periksa pubspec.yaml dan pesan pub get.\n"
                  )
              elif project_outcome == "failure":
                  content += (
                      "Proyek Flutter tidak terdeteksi.\n"
                      "Pastikan ZIP berisi pubspec.yaml.\n"
                  )
              elif not lines:
                  content += (
                      "Log proses tidak tersedia.\n"
                      "Periksa step gagal di GitHub Actions.\n"
                  )
              else:
                  useful = [
                      x.strip() for x in lines
                      if x.strip() and not noise.search(x)
                  ]
                  content += "\n".join(useful[-12:]) + "\n"

          # Maksimal 4096 byte, termasuk UTF-8.
          marker = "\n[LOG DIPANGKAS: batas 4 KB]\n".encode("utf-8")
          data = content.encode("utf-8")

          if len(data) > 4096:
              data = data[:4096 - len(marker)]
              data = data.decode(
                  "utf-8", errors="ignore"
              ).encode("utf-8") + marker

          with open(report_path, "wb") as f:
              f.write(data)

          print("===== ALDOO_BUILD_REPORT_BEGIN =====")
          print(data.decode("utf-8", errors="replace"), end="")
          print("===== ALDOO_BUILD_REPORT_END =====")
          print(f"Report size: {len(data)} bytes")
          PY

      - name: Package APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          APK_DIR="${{ steps.project.outputs.project_root }}/build/app/outputs/flutter-apk"
          mkdir -p "$GITHUB_WORKSPACE/apk_output"

          find "$APK_DIR" -maxdepth 1 -type f -name "*.apk" \
            -exec cp {} "$GITHUB_WORKSPACE/apk_output/" \;

          if ! find "$GITHUB_WORKSPACE/apk_output" \
            -maxdepth 1 -type f -name "*.apk" | grep -q .; then
            echo "ERROR: APK tidak ditemukan."
            exit 1
          fi

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: ${{ github.workspace }}/apk_output/*.apk
          if-no-files-found: error
          retention-days: 7

      - name: Ensure report exists
        if: always()
        shell: bash
        run: |
          mkdir -p "$LOG_DIR"

          if [ ! -f "$LOG_DIR/build-error.txt" ]; then
            printf '%s\n' \
              "BUILD FAILED" \
              "Mode: $BUILD_TYPE" \
              "Error utama tidak tertangkap." \
              "Periksa step pertama yang gagal di GitHub Actions." \
              > "$LOG_DIR/build-error.txt"
          fi

          # Batas keras 4096 byte.
          head -c 4096 "$LOG_DIR/build-error.txt" \
            > "$RUNNER_TEMP/report-limited.txt"

          mv "$RUNNER_TEMP/report-limited.txt" \
            "$LOG_DIR/build-error.txt"

      - name: Upload build error report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.build_type }}
          path: ${{ github.workspace }}/build_logs/build-error.txt
          if-no-files-found: error
          retention-days: 7
