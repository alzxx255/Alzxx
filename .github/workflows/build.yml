name: Flutter APK Builder

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag containing source ZIP"
        required: true
        type: string

      build_type:
        description: "APK build type"
        required: true
        type: choice
        options:
          - release
          - debug
        default: release

permissions:
  contents: read

concurrency:
  group: flutter-build-${{ github.repository }}-${{ inputs.tag }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  build:
    name: Flutter ${{ inputs.build_type }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      BUILD_TYPE: ${{ inputs.build_type }}
      SOURCE_DIR: ${{ github.workspace }}/source
      LOG_DIR: ${{ github.workspace }}/build_logs

    steps:

      - name: Checkout builder repository
        uses: actions/checkout@v4

      - name: Prepare environment
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip gh
          mkdir -p "$SOURCE_DIR" "$LOG_DIR"

      - name: Download source ZIP
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          cd "$SOURCE_DIR"

          gh release download "${{ inputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern "*.zip" \
            --clobber

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP tidak ditemukan."
            exit 1
          fi

          echo "Extracting: $ZIP_FILE"
          unzip -o "$ZIP_FILE"
          rm -f "$ZIP_FILE"

      - name: Detect Flutter project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          PUBSPEC="$(find "$SOURCE_DIR" -type f -name "pubspec.yaml" \
            -not -path "*/build/*" -not -path "*/.git/*" | head -n 1)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml tidak ditemukan."
            exit 1
          fi

          PROJECT_ROOT="$(cd "$(dirname "$PUBSPEC")" && pwd)"
          echo "project_root=$PROJECT_ROOT" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ✅ FLUTTER 3.34.0 → DART 3.9.0 → COCOK DENGAN SDK ^3.8.1 ✅
      - name: Setup Flutter — Dart 3.9.0 (Support SDK ^3.8.1)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.34.0'
          channel: stable
          cache: true

      - name: Flutter environment check
        run: |
          echo "=== Flutter Version ==="
          flutter --version
          echo "=== Dart Version ==="
          dart --version
          flutter doctor -v

      - name: Flutter clean & pub get
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project_root }}"
          cd "$PROJECT"
          flutter clean
          flutter pub get

      - name: Fix Gradle Compatibility
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project_root }}"
          cd "$PROJECT/android"
          echo "android.newDsl=false" >> gradle.properties
          echo "org.gradle.jvmargs=-Xmx4G" >> gradle.properties
          echo "✅ Gradle config fixed!"

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          PROJECT="${{ steps.project.outputs.project_root }}"
          LOG="$LOG_DIR/flutter-build.log"
          cd "$PROJECT"

          echo "Build Type : $BUILD_TYPE" | tee "$LOG"
          flutter --version 2>&1 | tee -a "$LOG"
          echo "" | tee -a "$LOG"

          if [ "$BUILD_TYPE" = "debug" ]; then
            flutter build apk --debug --verbose 2>&1 | tee -a "$LOG"
          else
            flutter build apk --release --verbose 2>&1 | tee -a "$LOG"
          fi

      - name: Package APK
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="${{ steps.project.outputs.project_root }}"
          mkdir -p "$GITHUB_WORKSPACE/apk_output"
          find "$PROJECT/build/app/outputs/flutter-apk" -type f -name "*.apk" -exec cp {} "$GITHUB_WORKSPACE/apk_output/" \;
          ls -lh "$GITHUB_WORKSPACE/apk_output"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ inputs.build_type }}
          path: ${{ github.workspace }}/apk_output/*.apk
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.build_type }}-${{ github.run_id }}
          path: ${{ github.workspace }}/build_logs/**
          if-no-files-found: warn
